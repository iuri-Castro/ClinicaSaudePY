<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estatisticas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MKn5NWVBEuQXJE7TSKSgPUmMiSCmVTfCsR+VSSeQpHnoyJQZZFn/kBn+Ht5jZDPQ" crossorigin="anonymous">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<div class="container text-center mt-5">
    <h2 class="text-center mb-4">Estatísticas</h2>
    <p id="mensagem"></p>
     <div class="card shadow mx-auto p-4" style="max-width: 450px;">    
        <p>Total de pacientes: <span id="total"></span></p>
        <p>Idade média: <span id="media"></span></p>
        <p>Paciente mais novo: <span id="menor"></span></p>
        <p>Paciente mais velho: <span id="maior"></span></p>
        <a href="/" class="btn btn-secondary">Voltar</a>
    </div>
</div>
<script>
fetch("/estatisticas")
    .then(r => r.json())
    .then(dados => {
        if (dados.erro) {
            document.getElementById("mensagem").textContent = dados.erro;
            return;
        }
        document.getElementById("total").textContent = dados.total_pacientes;
        document.getElementById("media").textContent = dados.media_idade.toFixed(1);
        document.getElementById("menor").textContent = dados.menor_idade + " anos";
        document.getElementById("maior").textContent = dados.maior_idade + " anos";
    });
</script>
</body>
</html>
