<!DOCTYPE html>
<html lang="pt-br" data-bs-theme=light>
<head>
    <meta charset="UTF-8">
    <title>Pacientes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MKn5NWVBEuQXJE7TSKSgPUmMiSCmVTfCsR+VSSeQpHnoyJQZZFn/kBn+Ht5jZDPQ" crossorigin="anonymous">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">

</head>
<body>
    <div class="container text-center mt-5">
        <h2 class="text-center mb-4">Pacientes cadastrados</h2>
        <div class="card shadow mx-auto mt-4" style="max-width: 400px;">
            <ul id="lista" class="list-unstyled"></ul>
            
        </div>
        <br>
            <a href="/" class="btn btn-secondary">Voltar</a>

    </div>

    <script> fetch("/lista")
        .then(r => r.json())
        .then(pacientes => {
            const ul = document.getElementById("lista");
            pacientes.forEach(p => {
                const li = document.createElement("li");
                li.textContent = p.nome + " - " + p.idade + " anos - " + p.sexo + " - " + p.telefone;
                ul.appendChild(li);
            });
        });</script>
</body>
</html>
