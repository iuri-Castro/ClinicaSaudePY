<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar Paciente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MKn5NWVBEuQXJE7TSKSgPUmMiSCmVTfCsR+VSSeQpHnoyJQZZFn/kBn+Ht5jZDPQ" crossorigin="anonymous">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container text-center mt-5">
        <h2 class="mb-4">Buscar Paciente</h2>
        <div class="card shadow mx-auto p-4" style="max-width: 450px;">
            <label for="nome">Nome:</label>
            <input class="form-control mb-3" type="text" id="nome" placeholder="Digite o nome">


            <button onclick="buscar()" class="btn-outline theme-secondary">Buscar</button>
             
            
            <p id="mensagem" class="mt-3"></p>
            <ul id="lista" class="list-unstyled"></ul>

            <a href="/" class="btn btn-secondary">Voltar</a>
        </div>
    </div>
    
<script>
    async function buscar() {
    const nome = document.getElementById("nome").value;
    const resposta = await fetch("/buscar?nome=" + encodeURIComponent(nome));
    const resultado = await resposta.json();
    console.log(resultado);              

    const ul = document.getElementById("lista");
    const msg = document.getElementById("mensagem");
    ul.innerHTML = "";
    msg.textContent = resultado.length === 0 ? "Nenhum paciente encontrado." : "";

    resultado.forEach(p => {
        const li = document.createElement("li");
        li.textContent = p.nome + " - " + p.idade + " anos - " + p.telefone;
        ul.appendChild(li);
    });
    }
</script>
</body>
</html>
