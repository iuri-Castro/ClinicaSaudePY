<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Pacientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MKn5NWVBEuQXJE7TSKSgPUmMiSCmVTfCsR+VSSeQpHnoyJQZZFn/kBn+Ht5jZDPQ" crossorigin="anonymous">
    
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container text-center mt-5">
        <h1 class="text-center mb-4">Cadastro de Pacientes</h1>

        <div class="card shadow mx-auto p-4" style="max-width: 450px;">
            <form action="/cadastrar" method="post">

                
                <label for="nome">Nome:</label>
                <input class="form-control mb-3" type="text" id="nome" name="nome" required>
                

                
                <label for="idade">Idade:</label>
                <input class="form-control mb-3" type="number" id="idade" name="idade">
                
 
                
                <label for="sexo">Sexo:</label>
                <select class="form-control mb-3" id="sexo" name="sexo">
                    <option value="">Selecione...</option>
                    <option value="masculino">Masculino</option>
                    <option value="feminino">Feminino</option>
                    <option value="automovel">Autmóvel</option>
                    <option value="transgenero">Transgênero</option>
                    <option value="nao_binario">Não Binário</option>
                    <option value="outro">Outro</option>
                </select>
                 
                
                
                <label for="telefone">Telefone:</label>
                <input class="form-control mb-4" type="tel" id="telefone" name="telefone">
                

                <input type="submit" value="Cadastrar" class="btn-outline theme-secondary">
            </form>
            <br>
            <a href="/" class="btn btn-secondary">Voltar</a>
        </div>   
    </div>

    <button type="button" class="btn-outline theme-inverse">Inverse</button>
</body>
</html>
